name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # `.env` is not committed. `vite build` uses production mode, so it does not load `.env.test`.
    # Match `.env.test` so lint / test / build always have valid `VITE_SUPABASE_*` for the Supabase client module.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 matches local dev and the husky hooks (see .husky/pre-commit).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        # The job container lives inside forgejo-dind's 1.5 GiB cgroup, but V8
        # sizes its heap from the HOST's memory (cgroup limits are invisible to
        # os.totalmem()), so an uncapped `vite build` delays GC until the cgroup
        # OOM killer fires (exit 137, "Killed" at "computing gzip size...").
        # The cap forces GC well below the ceiling; local peak RSS is ~0.9 GiB.
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: npm run build

  # --------------------------------------------------------------------------
  # Деплой staging. Существует потому, что автодеплой Timeweb — интеграция
  # ИСКЛЮЧИТЕЛЬНО с GitHub: на репозиторий в Forgejo он не срабатывает никогда,
  # и настройка «Сборка по последнему выполненному коммиту» этого не лечит
  # (проверено трижды, тумблер для форж-приложения мёртв). Приложение при этом
  # подключено правильно и даже видит новые коммиты в своём списке — оно просто
  # не собирает их само.
  #
  # Поэтому деплой инициируем мы, тем же публичным API, которым уже пользуется
  # blog-rebuild-frontend: POST /apps/{id}/deploy с КОНКРЕТНЫМ 40-символьным sha
  # (короткий отвергается). Канонический разбор этого API и его ловушек лежит в
  # rovno-db/supabase/functions/_shared/timewebDeploy.ts — правишь тут, свери
  # поведение с ним.
  #
  # `needs: build` — не украшение: без него на staging уезжал бы коммит с
  # красными тестами. Джоба идёт ТОЛЬКО на push в dev, поэтому PR-прогоны и
  # прочие ветки её не касаются.
  # --------------------------------------------------------------------------
  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Худший случай цикла ниже: входной assert (curl до 15с) + 16 POST x 10с +
    # 15 пауз x (sleep 30с + assert до 15с) ≈ 14.2 мин. Потолок выше него с
    # запасом, чтобы джоба всегда умирала СВОИМ exit-путём с внятным
    # сообщением, а не киллом раннера. Меняешь ретраи/таймауты — пересчитай.
    timeout-minutes: 20
    steps:
      - name: Trigger the Timeweb staging deploy
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          # Не секрет: id виден в адресе кабинета. Приложение «Front Staging
          # Forgejo», ветка dev, домен vladosda0-rovno-90e7.twc1.net.
          TIMEWEB_APP_ID: "236591"
          COMMIT_SHA: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Красный, не зелёный: секрет заведён 2026-08-17, так что его
          # отсутствие теперь — поломка (ротация, перенос репо), а зелёная
          # джоба, не задеплоившая ничего, — ровно тот молчаливо замёрзший
          # staging, ради которого джоба и существует.
          if [ -z "${TIMEWEB_API_TOKEN:-}" ]; then
            echo "TIMEWEB_API_TOKEN отсутствует в секретах репозитория." >&2
            echo "Staging НЕ задеплоен. Верните секрет (Settings -> Actions -> Secrets)" >&2
            echo "и перезапустите джобу." >&2
            exit 1
          fi

          # API принимает только полные 40 hex. Проверяем до запроса, иначе
          # получим 400 с невнятным телом.
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha не похож на полный 40-hex: $COMMIT_SHA" >&2
            exit 1
          fi

          # Анти-откатный гард: деплоим ТОЛЬКО текущую голову dev. Ручной
          # перезапуск старой джобы иначе увёз бы staging на старый коммит с
          # зелёной галкой — класс ловушки №2 из timewebDeploy.ts. Сверка через
          # API форжа; токен только в заголовке, в лог не попадает.
          #
          # Гард стоит в ДВУХ местах: на входе и перед каждым повторным POST в
          # 409-цикле — окно ожидания тянется до ~10 минут, и голова за это
          # время может уехать (при одном раннере интерливинг недостижим, но
          # второй раннер сделал бы одноразовую проверку декоративной).
          # Не смогли определить голову — отказ, а не деплой вслепую; ответ
          # без 40-hex id — тоже отказ, иначе кривой JSON превращался бы в
          # зелёный «superseded None» с незадеплоенным staging.
          resolve_dev_head() {
            curl -sS --max-time 15 \
              -H "Authorization: token ${FORGE_TOKEN}" \
              "https://git.rovno.ai/api/v1/repos/vladosda0/rovno/branches/dev" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["id"])'
          }
          assert_still_head() {
            local head_sha
            head_sha=$(resolve_dev_head) || head_sha=""
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Не удалось получить голову dev с форжа (получено: '${head_sha}') — отказ вместо слепого деплоя." >&2
              exit 1
            fi
            if [ "$head_sha" != "$COMMIT_SHA" ]; then
              echo "Голова dev уже $head_sha, а эта джоба несёт $COMMIT_SHA."
              echo "Деплой пропущен как устаревший: новый push несёт собственную джобу."
              exit 0
            fi
          }
          assert_still_head

          # 409 = Timeweb уже собирает другой деплой (он их сериализует), 000 =
          # сетевой сбой curl (DNS/TLS/таймаут) — оба ЖДЁМ и повторяем, а не
          # падаем и не выходим нулём: зелёная джоба обязана значить «этот sha
          # поставлен в сборку». Повторный POST того же sha безопасен: тот же
          # коммит, а занятый Timeweb просто ответит 409 ещё раз. Окно ~10
          # минут покрывает два коротких статических билда подряд; наблюдался
          # и хвост 8+ минут у соседнего приложения (timewebDeploy.ts) — такой
          # уйдёт в красный с советом перезапустить, что безопасно благодаря
          # анти-откатному гарду выше.
          for attempt in $(seq 1 16); do
            # Свежий файл на каждую попытку: иначе после сетевого сбоя (000)
            # под кодом печаталось бы тело ПРЕДЫДУЩЕГО ответа.
            rm -f /tmp/tw.json
            code=$(curl -sS -o /tmp/tw.json -w '%{http_code}' --max-time 10 \
              -X POST "https://api.timeweb.cloud/api/v1/apps/${TIMEWEB_APP_ID}/deploy" \
              -H "Authorization: Bearer ${TIMEWEB_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"commit_sha\":\"${COMMIT_SHA}\"}") || code=000
            echo "попытка ${attempt}: HTTP $code"
            # Тело печатаем всегда: токена в нём нет, а причина отказа нужна в логе.
            cat /tmp/tw.json 2>/dev/null || true; echo
            case "$code" in
              2*) echo "Деплой ${COMMIT_SHA} запущен."; exit 0 ;;
              409|000) if [ "$attempt" -lt 16 ]; then sleep 30; assert_still_head; fi ;;
              401|403) echo "Timeweb не принял токен ($code). Проверьте TIMEWEB_API_TOKEN." >&2; exit 1 ;;
              *) echo "Timeweb ответил $code." >&2; exit 1 ;;
            esac
          done
          echo "За ~10 минут не удалось запустить деплой (409 или сетевые сбои на каждой попытке)." >&2
          echo "Этот sha НЕ задеплоен. Перезапустите джобу: анти-откатный гард сам откажется," >&2
          echo "если к тому моменту dev уедет вперёд." >&2
          exit 1
