<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ровно ИИ</title>
    <meta name="description" content="Управление строительными проектами" />
    <meta name="author" content="rovno.ai" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="Ровно ИИ" />
    <meta property="og:description" content="Управление строительными проектами" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rovno.ai/rovno-logo.png" />

    <!--
      Russian is the default this shell is authored in, so og:locale starts at
      ru_RU. Both tags are rewritten at runtime by src/i18n.ts when the active
      language is English (`?lang=en`, a stored choice, or an English browser),
      which is also what keeps <html lang> honest. The landing additionally
      manages its own title/description/hreflang — see LandingSeo.
    -->
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ровно ИИ" />

    <link rel="alternate" type="application/rss+xml" title="Блог Ровно" href="https://rovno.ai/blog/feed.xml" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
