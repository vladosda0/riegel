<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // www.rovno.ai -> rovno.ai. Timeweb App Platform serves the same app on
      // every attached domain and offers no edge redirect, so without this www
      // answers with a duplicate of the whole site. Inline and first in <head>
      // so it fires before the icon/manifest fetches and the SPA boot below.
      // Plain ES3: this script is served untranspiled.
      (function () {
        var host = location.host;
        if (host.slice(0, 4) !== "www.") return;
        var bare = host.slice(4);
        // Leave hosts with no registrable domain left alone (e.g. www.localhost).
        if (bare.indexOf(".") < 1) return;
        location.replace(
          location.protocol + "//" + bare + location.pathname + location.search + location.hash
        );
      })();
    </script>

    <title>Ровно ИИ</title>
    <meta name="description" content="Управление строительными проектами" />
    <meta name="author" content="rovno.ai" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="Ровно ИИ" />
    <meta property="og:description" content="Управление строительными проектами" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rovno.ai/rovno-logo.png" />

    <!--
      The shell is Russian and stays Russian: every route serves this file, and
      all of them except the landing are Russian-only. og:locale:alternate is
      deliberately absent here — advertising an English version of /offer,
      /privacy or /blog/ would claim a translation that does not exist.

      The landing is the one route with a second language version, so it manages
      og:locale, og:locale:alternate, canonical and hreflang itself, scoped to
      "/" and torn down on unmount. See src/components/landing/LandingSeo.tsx.
    -->
    <meta property="og:locale" content="ru_RU" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ровно ИИ" />

    <link rel="alternate" type="application/rss+xml" title="Блог Ровно" href="https://rovno.ai/blog/feed.xml" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
