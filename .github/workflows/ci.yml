# ЗАМОРОЖЕНО 2026-08-13. Канонический источник — .forgejo/workflows/ci.yml.
#
# Аккаунт vladosda0 на GitHub заблокирован (403 на всё), CI переехал на
# git.rovno.ai. Forgejo читает .forgejo/workflows и, если этот каталог есть,
# .github/workflows НЕ читает вообще: проверено живым запросом 2026-08-13, dispatch
# по файлу из .github отвечает "workflow not found".
#
# НО: на ветке, где каталога .forgejo/workflows НЕТ (все ветки до посадки этого
# коммита, включая старые audit/* и головы открытых PR), Forgejo откатывается на
# этот файл — то есть до посадки исполняется именно он. Поэтому функциональные
# правки CI зеркалятся в оба файла, пока .forgejo не доехал до всех живых веток.
#
# Правишь CI — правь .forgejo/workflows/ci.yml (и зеркаль сюда, пока идёт переход).
# Файл оставлен намеренно, на случай если GitHub разблокируют; удалять его не нужно.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # `.env` is not committed. `vite build` uses production mode, so it does not load `.env.test`.
    # Match `.env.test` so lint / test / build always have valid `VITE_SUPABASE_*` for the Supabase client module.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 matches local dev and the husky hooks (see .husky/pre-commit).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        # The job container lives inside forgejo-dind's 1.5 GiB cgroup, but V8
        # sizes its heap from the HOST's memory (cgroup limits are invisible to
        # os.totalmem()), so an uncapped `vite build` delays GC until the cgroup
        # OOM killer fires (exit 137, "Killed" at "computing gzip size...").
        # The cap forces GC well below the ceiling; local peak RSS is ~0.9 GiB.
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: npm run build
